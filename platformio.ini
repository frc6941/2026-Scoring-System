[platformio]
default_envs = blue-hub, red-hub

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  arduino-libraries/Ethernet@^2.0.2
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:blue-hub]
build_flags =
  ${env.build_flags}
  -D HUB_IS_RED=0

[env:red-hub]
build_flags =
  ${env.build_flags}
  -D HUB_IS_RED=1
